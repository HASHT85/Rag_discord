services:
  discord-rag-bot-v2:
    build: .
    container_name: discord-rag-bot-v2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vectorstore
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
